<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http: https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: data:; connect-src http: https;"
    />
    <title>跟鱼说话 · dsh-pet-gpw</title>
    <style>
      /*
       * 悬浮输入框 —— 独立小窗，贴在宠物**脚底下方**。
       *
       * 为什么独立成窗（而不是留在胶囊窗或宠物窗里）：
       *   它和胶囊分处宠物上/下两侧；合一个窗的话那个窗要横跨宠物全身，
       *   而它是**永远可交互**的，面积会大很多。独立后它只有 336x40，
       *   而且**平时整窗隐藏**（不是透明而是 hide()），隐藏时连点击都不拦。
       *
       * 注意 body 背景必须透明、且不留边距：窗口比内容大一点也没关系，
       * 但多出来的透明区域仍会拦点击，所以窗口尺寸要贴着内容（见 gpw-main 的 INPUT_WINDOW）。
       */
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: transparent; overflow: hidden; user-select: none;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif;
      }
      #bar {
        display: flex; align-items: center; gap: 6px;
        width: 100%; height: 100%;
        padding: 5px 7px; border-radius: 10px;
        background: rgba(24, 24, 28, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        font-size: 12px;
      }
      #bar input {
        flex: 1 1 auto; min-width: 0; border: none; outline: none;
        background: transparent; color: #f2f2f6; font: inherit;
      }
      #bar input::placeholder { color: rgba(242, 242, 246, 0.45); }
      /* 本鱼 / 全体：小圆角按钮，选中「全体」时描边发蓝 */
      #bar button#scope {
        border: 1px solid rgba(255, 255, 255, 0.28); background: rgba(20, 22, 28, 0.85);
        color: #dfe3ea; border-radius: 999px; padding: 2px 8px; font: inherit; font-size: 11px;
        white-space: nowrap; cursor: pointer;
      }
      #bar button#scope.all { border-color: rgba(120, 180, 255, 0.75); color: #bfe0ff; }
      #bar button#scope:hover { background: rgba(40, 46, 60, 0.92); }
      #bar button {
        border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(77, 141, 255, 0.92);
        color: #fff; border-radius: 7px; padding: 2px 9px; font: inherit; cursor: pointer;
      }
      #bar button[disabled] { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="bar">
      <!-- 本鱼 / 全体：这句话只对这只鱼说，还是广播给所有鱼（默认本鱼） -->
      <button type="button" id="scope" title="本鱼：只记这条鱼，不广播">本鱼</button>
      <input type="text" placeholder="跟鱼说一句，Enter 发送" />
      <button type="button" class="send">发送</button>
    </div>
    <script src="./input.js"></script>
  </body>
</html>
